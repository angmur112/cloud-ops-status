name: Validate and deploy dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Validate required files and title
        shell: pwsh
        run: |
          if (-not (Test-Path -Path "./index.html" -PathType Leaf)) {
            throw "index.html is missing"
          }

          if (-not (Test-Path -Path "./styles.css" -PathType Leaf)) {
            throw "styles.css is missing"
          }

          $hasTitle = Select-String -Path "./index.html" -Pattern "<title>Cloud Operations Status</title>" -SimpleMatch -Quiet
          if (-not $hasTitle) {
            throw "Required title is missing"
          }
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
